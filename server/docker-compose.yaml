version: '3.9'

services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:  
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
      
  redis:
    image: redis
    restart: always
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: password
    volumes:
      - redisdata:/data
    networks:
      - app-network

    


volumes:
  pgdata:
  redisdata:

networks:
  app-network:
    driver: bridge
